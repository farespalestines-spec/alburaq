.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.tab .bdg{position:absolute;inset-block-start:3px;margin-inline-start:20px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:600 10px/16px var(--f-num);text-align:center;font-style:normal}
.chatlist{display:flex;flex-direction:column;gap:6px;padding-block:4px 12px}
.cday{align-self:center;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 12px;margin-block:8px 2px}
.msg{max-width:84%;padding:8px 12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.msg.me{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-end-end-radius:5px}
.msg:not(.me){border-end-start-radius:5px}
.msg .who{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:1px}
.msg .tx{white-space:pre-wrap}
.msg .mt{font-size:10.5px;opacity:.7;margin-top:2px;display:flex;gap:10px;justify-content:space-between}
.msg .mt button{background:none;border:0;padding:0;font-size:10.5px;color:inherit;text-decoration:underline;cursor:pointer;opacity:.9}
.chatbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;align-items:flex-end;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.chatbar textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;max-height:120px}
.chatbar .btn{margin:0;width:auto;padding:11px 18px}
.chatbar textarea:focus-visible{outline:2px solid var(--accent)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rgrid label.fld{margin-top:0}
.rgrid .inp{margin-top:4px;padding:9px 10px;font-size:15px}
.rsum{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:12px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.rsum b{font-family:var(--f-num)}
.remember{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;font-size:13.5px;color:var(--muted);position:relative}
.remember input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.remember svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.remember .ck{margin-inline-start:auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.remember:has(input:checked){border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.remember:has(input:checked) .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.remember:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:900px){
  .chatbar{bottom:16px}
  body{padding-right:220px}
  #app{max-width:1000px;margin-inline:auto;padding-inline:28px;padding-block:20px 60px}
  header.top{margin-inline:0;margin-bottom:20px;border-radius:20px;padding:16px 22px}
  nav.tabs{inset-block:0;right:0;left:auto;width:220px;border-top:0;border-left:1px solid var(--line);box-shadow:none;padding:20px 12px;background:var(--surface)}
  nav.tabs .in{max-width:none;margin:0;flex-direction:column;gap:4px}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:15px}
  .tab svg{width:22px;height:22px}
  .tab:hover{background:var(--bg)}
  .tab[aria-selected="true"]{background:var(--accent-soft)}
  .tab[aria-selected="true"]::before{display:none}
  .fab{right:auto;left:32px;bottom:32px}
  #toast{bottom:90px}
  .stack.wide2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .stack.wide2>.hero,.stack.wide2>.card:last-child,.stack.wide2>.strip{grid-column:1/-1}
  .hero .big{font-size:48px}
}
</style>

function allFlows(){

    S.flo.forEach(function(x){if(x._c==='float'&&!cmIds[x.id])out.push({date:x.date,ts:x.ts,k:'flt',cash:x.kind==='in'?-(+x.price||0):0,w:x.w||'agency',wd:(x.kind==='in'?1:-1)*(+x.amount||0)})});

function saleFace(x){return (x.cat==='topup'&&x.face!=null?+x.face:+x.cost)||0}
function cashB(){return (S.cfg.bases||{}).cash||{ts:1,date:'0000-00-00',amount:0,implicit:true}}
function balAt(FL,key,D,incl){
  var b=key==='cash'?cashB():(S.cfg.bases||{})[key];if(!b||!b.ts||D<b.date)return null;
  var v=+b.amount||0;
  FL.forEach(function(f){
    if(f.ts<=b.ts)return;
    if(incl?f.date>D:f.date>=D)return;
    if(key==='cash'){v+=f.cash;return}
    if(f.w===key)v+=f.wd;
    if(f.k==='sale'&&S.cfg.src[f.s.cat]===key)v-=saleFace(f.s);
  });
  return v;
}
function dayRows(FL,D){
  var b=cashB(),r={sale:0,owe:0,pay:0,exp:0,flt:0};
  FL.forEach(function(f){if(f.date!==D||(b&&f.ts<=b.ts))return;r[f.k]=(r[f.k]||0)+f.cash});
  return r;
}
function calcBal(w){
  var b=(S.cfg.bases||{})[w]||null,bt=b?b.ts:0,base=b?b.amount:0,dep=0,wd=0,used=0;
  allFlows().forEach(function(f){
    if(f.ts<=bt)return;
    if(f.w===w){if(f.wd>0)dep+=f.wd;else wd+=-f.wd}
    if(f.k==='sale'&&S.cfg.src[f.s.cat]===w)used+=saleFace(f.s);
  });
  return {has:!!b,base:base,dep:dep,wd:wd,used:used,value:base+dep-wd-used};
}

function chart(sales,month){

function makePdf(pages){
  var enc=new TextEncoder(),parts=[],off=0,offs=[],n=pages.length;

  mark(1);push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  var kids=[],i;for(i=0;i<n;i++)kids.push((5+i*3)+' 0 R');
  mark(2);push('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
  for(i=0;i<n;i++){
    var im=3+i*3,ct=4+i*3,pg=5+i*3,p=pages[i],body='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    mark(im);push(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>\nstream\n');push(p.bytes);push('\nendstream\nendobj\n');
    mark(ct);push(ct+' 0 obj\n<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream\nendobj\n');
    mark(pg);push(pg+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
  }
  var size=3+n*3,xr=off;
  push('xref\n0 '+size+'\n0000000000 65535 f \n');
  for(i=1;i<size;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+size+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  var out=new Uint8Array(off),pos=0;parts.forEach(function(u){out.set(u,pos);pos+=u.length});

}

async function renderPdf(title,sub,blocks){

  function txt(t,x,yy,font,color,align){g.font=font;g.fillStyle=color||'#111';g.textAlign=align||'right';g.fillText(String(t),x,yy)}

  function heading(t){if(!room(130)){flush();fresh()}y+=30;txt(t,W-M,y+18,'600 32px '+FF);y+=44;g.fillStyle='#111';g.fillRect(M,y,W-2*M,3);y+=12}
  function table(head,rows,fr){
    var tw=W-2*M,RH=52,xs=[],acc=0;

  g.fillStyle='#0A3B2B';g.fillRect(0,0,W,16);txt('معرض البراق للاتصالات  ·  وكيل معتمد',W-M,y+10,'600 30px '+FF,'#0A3B2B');y+=56;
  txt(title,W-M,y+26,'600 46px '+FF);y+=70;
  if(sub){txt(sub,W-M,y+14,'500 30px '+FF,'#444');y+=50}
  blocks.forEach(function(b){

function wireSale(){
  var rec=$('#f-rec'),disc=$('#f-disc'),cost=$('#f-cost'),out=$('#f-profit'),net=$('#f-net'),touched=false;
  function cat(){return $('input[name=cat]:checked').value}
  function got(){var pr=num(rec.value);return pr-Math.min(Math.max(num(disc.value),0),pr)}
  function upd(){var g=got();net.textContent=fmt(g);if(out&&cost){var p=g-num(cost.value);out.textContent=fmt(p);out.className='n'+(p<0?' neg':'')}}
  function auto(){if(touched||!cost){upd();return}var r=num(rec.value),p=+S.cfg.rates[cat()]||0;cost.value=rec.value.trim()===''?'':String(r2(r*(1-p/100)));upd()}
  var face=$('#f-face'),faceTouched=false;
  function showFields(){var c=cat();$('#w-face').hidden=c!=='topup';$('#w-sim').hidden=!(c==='sim'||c==='simrep')}
  face.addEventListener('input',function(){faceTouched=true});
  rec.addEventListener('input',function(){if(!faceTouched)face.value=rec.value});
  rec.addEventListener('input',auto);
  disc.addEventListener('input',upd);
  if(cost)cost.addEventListener('input',function(){touched=true;upd()});
  document.querySelectorAll('input[name=cat]').forEach(function(i){i.addEventListener('change',function(){showFields();auto()})});
}
async function add(coll,data){
  try{
    data.by=S.myId||null;data.actor=S.actor?S.actor.id:null;
    var ref=S.db.collection(coll).doc();
    await ref.set(data);
    if(coll==='expenses')await S.db.doc('cashmov/'+ref.id).set(mirrorExp(data));
    else if(coll==='float')await S.db.doc('cashmov/'+ref.id).set(mirrorFlo(data));
    closeSheet();toast('تم الحفظ');return true;
  }catch(e){toast(errMsg(e));return false}
}
function mirrorExp(x){return {date:x.date,ts:x.ts,k:'exp',cash:-(+x.amount||0)}}
function mirrorFlo(x){return {date:x.date,ts:x.ts,k:'flt',w:x.w||'agency',wd:(x.kind==='in'?1:-1)*(+x.amount||0),cash:x.kind==='in'?-(+x.price||0):0}}
async function backfillMirror(){
  if(!S.pmgr||!S.db||S.bf)return;S.bf=true;
  try{
    var r=await Promise.all([S.db.collection('expenses').limit(1000).get(),S.db.collection('float').limit(1000).get(),S.db.collection('cashmov').limit(1000).get()]);
    var have={},jobs=[],i;r[2].docs.forEach(function(d){have[d.id]=1});
    r[0].docs.forEach(function(d){if(!have[d.id])jobs.push([d.id,mirrorExp(d.data())])});
    r[1].docs.forEach(function(d){if(!have[d.id])jobs.push([d.id,mirrorFlo(d.data())])});
    for(i=0;i<jobs.length;i++)await S.db.doc('cashmov/'+jobs[i][0]).set(jobs[i][1]);
  }catch(e){}
}

  histKey=String(m);
  histUn.forEach(function(u){try{u()}catch(e){}});histUn=[];histReady={};histCapped={};
  S.balSales=[];S.cm=[];S.sx=[];S.sf=[];S.histCap=false;
  if(!m){S.loaded.bal=true;render();return}
  S.loaded.bal=false;
  [['sales','balSales'],['cashmov','cm'],['staffexp','sx'],['staffflo','sf']].forEach(function(p){
    histUn.push(S.db.collection(p[0]).where('ts','>',m).limit(1000).onSnapshot(function(s){
      S[p[1]]=docs(s);histReady[p[0]]=true;histCapped[p[0]]=s.size>=1000;
      S.histCap=Object.keys(histCapped).some(function(k){return histCapped[k]});
      if(Object.keys(histReady).length>=4)S.loaded.bal=true;
      render();
    },function(){S.err=true;S.loaded.bal=true;render()}));
  });
}
function loadRep(){
  clearTimeout(tRep);
  tRep=setTimeout(async function(){
    if(!S.db||S.tab!=='rep')return;
    var m=S.month,start=m+'-01',end=monthShift(m,1)+'-01';
    try{
      var r=await Promise.all([
        S.db.collection('sales').where('date','>=',start).where('date','<',end).limit(1000).get(),
        S.db.collection('expenses').where('date','>=',start).where('date','<',end).limit(1000).get(),
        S.db.collection('staffexp').where('date','>=',start).where('date','<',end).limit(1000).get()]);
      if(m!==S.month)return;
      S.rep={key:m,sales:r[0].docs.map(function(d){return d.data()}),exps:r[1].docs.concat(r[2].docs).map(function(d){return d.data()})};
      S.loaded.rep=true;render();
    }catch(e){S.err=true;render()}
  },300);
}
async function resolveNames(){
  if(!S.user||!S.mgr)return;var ids=[];
  S.sales.concat(S.debts).forEach(function(x){if(x.by&&ids.indexOf(x.by)<0)ids.push(x.by)});
  var key=ids.join(',');if(!ids.length||key===S.nameKey)return;S.nameKey=key;
  var ps=await S.user.profiles(ids);ids.forEach(function(i){S.names[i]=(ps[i]&&ps[i].name)||''});render();
}
function docs(snap){return snap.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
function fail(){S.err=true;render()}
async function init(){
  applyUi();render();
  var api=window.claude&&window.claude.use?window.claude:null;
  if(!api){S.roleReady=true;render();return}
  var res=await Promise.all([api.use('db'),api.use('user'),api.use('downloads')]);
  var db=res[0],user=res[1];
  S.dl=res[2]||null;
  S.user=user;
  if(user){try{S.pmgr=!!((await user.isOwner())||(await user.canEdit()));S.mgr=S.pmgr;S.myId=await user.id()}catch(e){}}
  S.roleReady=true;
  if(!db){S.db=null;S.loaded={sales:true,exps:true,flo:true,debts:true,staff:true,cfg:true,bal:true,rep:true,chat:true};render();return}
  S.db=db;
  try{var cw=user&&user.can?user.can('data.write'):null;if(cw===false)S.canWrite=false}catch(e){}
  var from=S.mgr?minDay():today();
  db.collection('sales').where('date','>=',from).onSnapshot(function(s){S.sales=docs(s);S.loaded.sales=true;S.err=false;render();refreshBal();resolveNames();if(S.tab==='rep')loadRep()},fail);
  var eA=[],eB=[];
  function mergeExp(){S.exps=eA.map(function(x){return Object.assign({},x,{_c:'expenses'})}).concat(eB.map(function(x){return Object.assign({},x,{_c:'staffexp'})}));S.loaded.exps=true;render();if(S.tab==='rep')loadRep()}
  db.collection('expenses').where('date','>=',from).onSnapshot(function(s){eA=docs(s);mergeExp()},fail);
  db.collection('staffexp').where('date','>=',from).onSnapshot(function(s){eB=docs(s);mergeExp()},fail);
  var fA=[],fB=[];
  function mergeFlo(){S.flo=fA.map(function(x){return Object.assign({},x,{_c:'float'})}).concat(fB.map(function(x){return Object.assign({},x,{_c:'staffflo'})}));S.loaded.flo=true;render();refreshBal()}
  db.collection('float').orderBy('ts','desc').limit(300).onSnapshot(function(s){fA=docs(s);mergeFlo()},fail);
  db.collection('staffflo').orderBy('ts','desc').limit(300).onSnapshot(function(s){fB=docs(s);mergeFlo()},fail);
  try{S.chatSeen=+localStorage.getItem('chatSeen')||0}catch(e){}
  try{if(user&&S.myId){user.profiles([S.myId]).then(function(p){S.myName=(p&&p[S.myId]&&p[S.myId].name)||''})}}catch(e){}
  db.collection('chat').orderBy('ts','desc').limit(150).onSnapshot(function(sn){S.chat=docs(sn).reverse();var first=!S.loaded.chat;S.loaded.chat=true;if(first){var hs=false;try{hs=localStorage.getItem('chatSeen')!==null}catch(e){}if(!hs||S.tab==='chat')chatMark()}chatUpdate()},function(){S.loaded.chat=true;render()});
  db.collection('debts').orderBy('ts','desc').limit(1000).onSnapshot(function(s){S.debts=docs(s);S.loaded.debts=true;render();resolveNames()},fail);
  if(S.pmgr)db.collection('staff').onSnapshot(function(s){
    S.staff=docs(s);S.loaded.staff=true;
    if(S.actor){S.actor=S.staff.filter(function(x){return x.id===S.actor.id})[0]||null}
    else{try{var sid=sessionStorage.getItem('actor');if(sid){S.actor=S.staff.filter(function(x){return x.id===sid})[0]||null}}catch(e){}}
    applyRole();render();refreshBal();
  },fail);else S.loaded.staff=true;
  db.doc('config/main').onSnapshot(function(s){
    var d=s.exists?s.data():{};
    var legacy={};if(!d.src&&d.uses){Object.keys(d.uses).forEach(function(k){legacy[k]=d.uses[k]?(k==='topup'?'mobile':'agency'):'none'})}
    S.cfg={low:d.low!=null?d.low:DEF.low,rates:Object.assign({},DEF.rates,d.rates||{}),src:Object.assign({},DEF.src,legacy,d.src||{}),base:d.base||null,bases:Object.assign({agency:d.base||null},d.bases||{})};
    S.loaded.cfg=true;render();refreshBal();
  },fail);
  backfillMirror();
}
init();
})();
